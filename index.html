<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050614">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Learnæway — Path to Trading Course. The education arm of the Æway ecosystem.">
  <title>Learnæway</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/pwa/icon-192.png">
  <link rel="apple-touch-icon" href="assets/pwa/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">

    <!-- ============ HEADER ZONE (looping video — action icons live in the card footer) ============ -->
    <header class="header-zone" id="headerZone">
      <!-- `muted` stays in the markup on purpose: it is what guarantees the
           autoplay starts at all. app.js then asks for sound immediately, and
           keeps the muted playback if the browser refuses — so the clip is
           never silent AND stopped. The button above reports whichever of the
           two actually happened.
           No poster — the only still we hold is of the previous clip, and the
           wrong frame flashing under this one is worse than the video element's
           own dark ground. -->
      <video
        id="waveVideo"
        class="wave-bg wave-video"
        autoplay muted loop playsinline webkit-playsinline preload="auto"
      >
        <source src="assets/video/hero-loop.mp4" type="video/mp4">
      </video>
      <div class="wave-bg wave-still" aria-hidden="true"></div>
      <!-- session · time · date, sitting directly on the video. Plain white,
           no scrim or shadow behind it (per spec). Shown on every screen. -->
      <!-- Sound for whichever video is the hero here: the header clip on a
           phone, the banner's centre layer on desktop. Sits in the gear's
           column directly above it — the same 4% + 14px inset the bar uses for
           its own icons. The image follows the video's real muted state. -->
      <button id="hdrMute" class="hdr-mute" type="button"
              aria-label="Turn sound on" aria-pressed="false">
        <img src="assets/buttons-icon/btn-volume-off@2x.png" alt="">
      </button>
      <div class="wave-clock" id="waveClock">
        <div class="wc-session"><b id="wcSessionName"></b><span>Session</span></div>
        <div class="wc-time" id="wcTime"></div>
        <div class="wc-date" id="wcDate"></div>
      </div>
    </header>

    <!-- ============ TOP BARS (two separate pills, per corrected round-3 spec) ============ -->
    <div class="bar">
      <button id="btnMenu" class="bar-icon" aria-label="Open course menu">
        <img src="assets/nav-icons/icon-menu@2x.png" alt="">
      </button>
      <div id="barTitle" class="bar-title">Learnæway's Path to Trading Course</div>
      <button id="btnSettings" class="bar-icon" aria-label="Open settings">
        <img src="assets/nav-icons/icon-settings@2x.png" alt="">
      </button>
    </div>
    <div class="bar">
      <button id="btnProfile" class="bar-icon" aria-label="Open profile">
        <img src="assets/nav-icons/icon-user@2x.png" alt="">
      </button>
      <div class="progress-track" aria-hidden="false">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
        <span id="progressLabel" class="progress-label">0%</span>
      </div>
      <button id="btnBarHome" class="bar-icon" aria-label="Home">
        <img src="assets/nav-icons/icon-home@2x.png" alt="">
      </button>
    </div>

    <!-- Trade Day Check-In is the one screen whose second bar carries the
         section-progress dots instead of the date/time (which lives on the header
         video everywhere, this screen included). -->
    <div class="bar bar-checkin hidden" id="checkinBar">
      <button id="btnCheckinProfile" class="bar-icon" aria-label="Open profile">
        <img src="assets/nav-icons/icon-user@2x.png" alt="">
      </button>
      <div id="checkinStreak" class="streak-row" role="img"></div>
      <button id="btnCheckinHome" class="bar-icon" aria-label="Back to home">
        <img src="assets/nav-icons/icon-home@2x.png" alt="">
      </button>
    </div>

    <!-- Pickæway's second bar carries the game name, per the mockup -->
    <div class="bar bar-pick hidden" id="pickBar">
      <button id="btnPickProfile" class="bar-icon" aria-label="Open profile">
        <img src="assets/nav-icons/icon-user@2x.png" alt="">
      </button>
      <div class="pick-name">Cool Down Game</div>
      <button id="btnPickHome" class="bar-icon" aria-label="Home">
        <img src="assets/nav-icons/icon-home@2x.png" alt="">
      </button>
    </div>

    <!-- the Profile screen's own bar: which mode you're in, and the way home -->
    <div class="bar bar-pick hidden" id="profileBar">
      <button id="btnProfileEdit" class="bar-icon" aria-label="Edit profile">
        <img src="assets/nav-icons/icon-user@2x.png" alt="">
      </button>
      <div class="pick-name" id="profileBarName">Your Profile</div>
      <button id="btnProfileHome" class="bar-icon" aria-label="Home">
        <img src="assets/nav-icons/icon-home@2x.png" alt="">
      </button>
    </div>

    <!-- Trade Journal swaps the progress bar for the account summary -->
    <div class="bar bar-journal hidden" id="journalBar">
      <button id="btnJournalProfile" class="bar-icon" aria-label="Open profile">
        <img src="assets/nav-icons/icon-user@2x.png" alt="">
      </button>
      <div id="journalSummary" class="journal-summary"></div>
      <button id="btnJournalHome" class="bar-icon" aria-label="Home">
        <img src="assets/nav-icons/icon-home@2x.png" alt="">
      </button>
    </div>

    <!-- ===================== MAIN CONTENT CARD ===================== -->
    <main class="card-outer" id="cardOuter">
      <div class="card" id="card">
        <div class="card-scroll" id="cardScroll">
          <!-- view content injected by app.js -->
        </div>
        <div class="card-footer" id="cardFooter">
          <img class="wordmark" src="assets/logo/logo-wordmark@3x.png" alt="æway">
          <div class="footer-row">
            <button id="btnNotes" class="footer-icon" aria-label="Notes for this screen"></button>
            <button id="btnAskAeway" class="action-btn" aria-label="Ask Æway">
              <img src="assets/buttons-icon/btn-ask-aeway-v2@2x.png" alt="">
            </button>
            <button id="btnVolume" class="action-btn" aria-label="Toggle sound">
              <img id="volumeImg" src="assets/buttons-icon/btn-volume-on@2x.png" alt="">
            </button>
            <button id="btnPlay" class="action-btn" aria-label="Play narration">
              <img id="playImg" src="assets/buttons-icon/btn-play@2x.png" alt="">
            </button>
            <button id="btnReplay" class="action-btn" aria-label="Replay narration">
              <img src="assets/buttons-icon/btn-replay@2x.png" alt="">
            </button>
            <button id="btnHeart" class="footer-icon" aria-label="Like this screen"></button>
          </div>
        </div>
      </div>
    </main>

    <!-- ==== BOTTOM DOCK — one pattern app-wide:
         Check-In · + · Profile · Battle · Play ==== -->
    <nav class="bottom-nav" id="dock">
      <button id="navCheckin" class="dock-btn" aria-label="Trade Day Check-In">
        <img src="assets/nav-icons/icon-trade-day@2x.png" alt="">
      </button>
      <button id="navAdd" class="dock-btn" aria-label="Trade Journal">
        <img src="assets/nav-icons/icon-trade-journal@2x.png" alt="">
      </button>
      <!-- centre slot: the ring frame is the button's background, the photo
           (or the default person icon) sits inside it -->
      <button id="navProfile" class="dock-btn dock-profile" aria-label="Profile">
        <img id="dockProfileImg" src="assets/nav-icons/icon-user@2x.png" alt="">
      </button>
      <!-- 4th slot: Match Replay -->
      <button id="navBattle" class="dock-btn dock-battle" aria-label="Pickæway — Match Replay">
        <img src="assets/nav-icons/icon-dock-match-replay@2x.png" alt="">
      </button>
      <button id="navPlay" class="dock-btn" aria-label="Video library">
        <img src="assets/nav-icons/icon-video-play@2x.png" alt="">
      </button>
    </nav>

    <!-- ==== FULL-SCREEN VERTICAL VIDEO PLAYER (9:16, covers bars + dock) ==== -->
    <div id="videoPlayer" class="vplayer hidden" role="dialog" aria-modal="true" aria-label="Video player"></div>

    <!-- profile photo picker, driven from Settings -->
    <input type="file" id="photoInput" accept="image/*" hidden>

    <!-- ===================== OVERLAYS ===================== -->
    <div id="overlay" class="overlay hidden">
      <div class="overlay-panel" id="overlayPanel"></div>
    </div>

    <!-- ===================== AUTH (pre-login entry, UI only) ===================== -->
    <div id="authScreen" class="auth-screen hidden">
      <div class="auth-wave"></div>

      <!-- Step 1: access gate — data capture + passcode gatekeeper -->
      <div id="gateStep" class="auth-card-outer hidden">
        <div class="auth-card">
          <img class="auth-logo" src="assets/logo/logo-symbol-v2@3x.png" alt="æway logo">
          <img class="auth-wordmark" src="assets/logo/logo-wordmark@3x.png" alt="æway">
          <div class="gate-title">Beta Access</div>
          <form id="gateForm" autocomplete="off" novalidate>
            <input class="g-pill auth-input" name="firstName" type="text" placeholder="First Name">
            <input class="g-pill auth-input" name="lastName" type="text" placeholder="Last Name">
            <input class="g-pill auth-input" name="email" type="email" placeholder="Email">
            <input class="g-pill auth-input" name="phone" type="tel" placeholder="Phone Number">
            <input class="g-pill auth-input" name="passcode" type="password" placeholder="Passcode">
            <div id="gateError" class="gate-error hidden">Invalid passcode — access denied.</div>
            <button type="submit" class="g-pill auth-submit">Enter</button>
          </form>
        </div>
      </div>

      <!-- Step 1.5: beta intake questionnaire — replaces the standalone Google
           Form. Answers merge onto the same Firestore lead record the access
           gate created, keyed by email. One screen at a time: an intro panel,
           then one question per screen (both rendered into #surveyForm by
           app.js, since the two layouts share little besides the wordmark). -->
      <div id="surveyStep" class="auth-card-outer hidden">
        <div class="auth-card">
          <img class="auth-wordmark" src="assets/logo/logo-wordmark@3x.png" alt="æway">
          <form id="surveyForm" autocomplete="off" novalidate></form>
        </div>
      </div>

      <!-- Step 1.75 (desktop only): intro video, then a Sign Up / Log In CTA.
           The login form below is no longer the default state on desktop — it
           is reached from here, or from the dock's Log In shortcut. -->
      <div id="introStep" class="auth-card-outer hidden">
        <div class="auth-card intro-card">
          <video id="introVideo" class="intro-video hidden" muted playsinline
                 webkit-playsinline preload="auto"></video>
          <div id="introCta" class="intro-cta hidden">
            <img class="auth-wordmark" src="assets/logo/logo-wordmark@3x.png" alt="æway">
            <button type="button" class="g-pill auth-tab intro-btn" data-intro="signup">Sign Up</button>
            <button type="button" class="g-pill auth-tab intro-btn" data-intro="login">Log In</button>
          </div>
        </div>
      </div>

      <!-- Step 2: login (existing screen, unchanged) -->
      <div id="loginStep" class="auth-card-outer">
        <div class="auth-card">
          <img class="auth-logo" src="assets/logo/logo-symbol-v2@3x.png" alt="æway logo">
          <img class="auth-wordmark" src="assets/logo/logo-wordmark@3x.png" alt="æway">
          <div class="auth-tabs" role="tablist">
            <button id="authTabLogin" class="g-pill auth-tab active" role="tab" aria-selected="true">Log In</button>
            <button id="authTabSignup" class="g-pill auth-tab" role="tab" aria-selected="false">Sign Up</button>
          </div>
          <form id="authForm" autocomplete="off" novalidate>
            <!-- fields injected by app.js based on active tab -->
          </form>
        </div>
      </div>

      <!-- desktop pre-login dock: the five app icons are post-login only, so
           while logged out the centre column's dock carries one Log In
           shortcut instead, available in every pre-login state. -->
      <div id="introDock" class="intro-dock hidden">
        <button type="button" class="intro-dock-btn" data-intro="login">
          <img src="assets/nav-icons/icon-user@2x.png" alt="">
          <span>Log In</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ DESKTOP-ONLY SHELL (>=1200px) ============
       A sibling of #app, never a wrapper around it: below the breakpoint this
       whole block is display:none and the mobile PWA renders exactly as it
       always has. At desktop width `display: contents` dissolves this div so
       its children land directly in the body grid alongside #app, which is how
       the header segments and the column panels stay pixel-aligned with the
       app shell between them.

       The banner's four layers are filled with <video> by app.js, and only at
       the desktop breakpoint — so a phone never downloads or decodes them.
       It spans the full width behind the app column, whose own header video is
       hidden at this width so the banner shows through it; the clock stays on
       top, over the centre video. -->
  <div class="dt-shell" id="dtShell" aria-hidden="true">
    <div class="dt-banner" id="dtBanner">
      <!-- painted back to front: floor, then the two flanking overlays that
           sit on it, then the centre video standing on its front edge -->
      <div class="dtb-layer dtb-floor" id="dtbFloor"></div>
      <div class="dtb-layer dtb-side dtb-left" data-dtb="left"></div>
      <div class="dtb-layer dtb-side dtb-right" data-dtb="right"></div>
      <div class="dtb-layer dtb-centre" data-dtb="centre"></div>
    </div>
    <div class="dt-col dt-left">
      <div class="dt-bar"></div>
      <div class="dt-panel dt-panel-square"></div>
      <div class="dt-lower dt-lower-left"></div>
    </div>
    <div class="dt-col dt-right">
      <div class="dt-bar"></div>
      <div class="dt-panel dt-panel-chart"></div>
      <div class="dt-panel dt-panel-wide"></div>
      <div class="dt-lower dt-lower-right"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="data/course-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
